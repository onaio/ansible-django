[project]
name = "sample-uv-project"
version = "0.1.0"
description = "Minimal Django app used by the molecule uv scenario"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sample"]
